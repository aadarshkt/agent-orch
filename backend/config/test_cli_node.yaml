# Minimal single-node cli_agent test.
#
# Uses the `test-cli` runtime preset from config/runtimes.yaml (image
# agent-orch-test-cli:latest). Build the image once with:
#   docker build -t agent-orch-test-cli:latest backend/docker/test-agent
#
# Import + run:
#   curl -s localhost:8010/workflows/import \
#     -H 'content-type: application/json' \
#     -d '{"yaml_path": "config/test_cli_node.yaml"}'
#   curl -s -X POST localhost:8010/workflows/<id>/execute
#   curl -s "localhost:8010/events/stream?thread_id=<thread_id>"
#   curl -s localhost:8010/workflows/<thread_id>/status
version: 1

agents:
  single:
    type: cli_agent
    runtime: test-cli
    inputs:
      artifacts: ["ai_review/**/*.md"]

workflow:
  name: "CLI Agent Single Node Test"
  description: "One cli_agent node using the test-cli runtime preset."
  hitl_enabled: false
  nodes:
    - { id: single, agent: single }
  edges: []
