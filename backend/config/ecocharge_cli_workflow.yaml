# Self-contained workflow: runtimes + agents + graph in one file.
# Import via POST /workflows/import with yaml_path=config/ecocharge_cli_workflow.yaml
version: 1

runtimes:
  - name: claude-cli
    kind: cli
    image: ghcr.io/eco/claude-agent:latest
    command: ["claude", "-p"]
    env: {}
    resource_limits:
      cpus: "1.0"
      memory: "512m"
    timeout: 300

agents:
  coder:
    type: cli_agent
    runtime: claude-cli
    inputs:
      # Every input is a Source { repo, ref, path } — one shape everywhere.
      repos:
        - { repo: "https://gitlab.eco/eco/app.git", ref: "feature/ecocharge", path: "" }
      skills:
        - { repo: "https://gitlab.eco/eco/skills.git", ref: "main", path: "review.md" }
      context:
        - { repo: "https://gitlab.eco/eco/docs.git", ref: "main", path: "architecture.md" }
        - { repo: "https://gitlab.eco/eco/standards.git", ref: "main", path: "coding_style.md" }
      prompt:
        { repo: "https://gitlab.eco/eco/skills.git", ref: "main", path: "prompt.md" }
      artifacts: ["**/*.md"]

  committer:
    type: git_commit
    inputs:
      source_nodes: [coding]
      # repo: app    # only needed when the node declares multiple repos

workflow:
  name: "EcoCharge CLI Pipeline"
  description: "CLI agent generates code, then commits it."
  hitl_enabled: true
  nodes:
    - { id: coding, agent: coder, requires_approval: false }
    - { id: commit, agent: committer, requires_approval: true }
  edges:
    - { from: coding, to: commit, condition: success }
