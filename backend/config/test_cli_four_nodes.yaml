# Four chained cli_agent nodes, to observe orchestration end to end:
# sequential execution, per-node workspaces, artifact collection and the
# upstream handoff (each node receives everything produced before it).
#
# Default uses the `test-cli` preset (fast, free, no LLM) so the SSE stream
# shows exactly what each node receives. To use a real model instead, change
# each agent's `runtime:` to `openrouter-agent`.
#
# Build the image once:
#   docker build -t agent-orch-test-cli:latest backend/docker/test-agent
#
# Import + run:
#   curl -s localhost:8010/workflows/import \
#     -H 'content-type: application/json' \
#     -d '{"yaml_path": "config/test_cli_four_nodes.yaml"}'
#   curl -s -X POST localhost:8010/workflows/<id>/execute
#   curl -s "localhost:8010/events/stream?thread_id=<thread_id>"
#   curl -s localhost:8010/workflows/<thread_id>/status
#
# Inspect a finished run (persisted node outputs + artifact paths, survives a
# page reload — the live SSE stream does not):
#   curl -s localhost:8010/workflows/<thread_id>/state
#
# Tip: set `requires_approval: true` on n3 and `hitl_enabled: true` to see the
# graph pause and require POST /workflows/<thread_id>/resume before n4 runs.
version: 1

agents:
  n1:
    type: cli_agent
    runtime: test-cli
    inputs:
      artifacts: ["ai_review/**/*.md"]
      env: { TEST_AGENT_MESSAGE: "node 1 output" }
  n2:
    type: cli_agent
    runtime: test-cli
    inputs:
      artifacts: ["ai_review/**/*.md"]
      env: { TEST_AGENT_MESSAGE: "node 2 output" }
  n3:
    type: cli_agent
    runtime: test-cli
    inputs:
      artifacts: ["ai_review/**/*.md"]
      env: { TEST_AGENT_MESSAGE: "node 3 output" }
  n4:
    type: cli_agent
    runtime: test-cli
    inputs:
      artifacts: ["ai_review/**/*.md"]
      env: { TEST_AGENT_MESSAGE: "node 4 output" }

  # Publish n4's run to GitHub so the change can be reviewed from a commit URL.
  # Creates the repo (public) if missing. Requires GITHUB_TOKEN in backend/.env.
  # Remove this agent and its node/edge to keep the chain CLI-only.
  publish:
    type: git_commit
    inputs:
      source_nodes: [n4]
      github_repo: "aadarshkt/agent-orch-runs"
      visibility: public
      branch: "main"
      commit_message: "test: CLI four-node chain output"
      # publish_artifacts: true        # default: include n4's collected artifacts
      # github_token_env: GITHUB_TOKEN # default

workflow:
  name: "CLI Four Node Chain"
  description: "n1 -> n2 -> n3 -> n4, each a cli_agent node, then publish to GitHub."
  hitl_enabled: false
  nodes:
    - { id: n1, agent: n1 }
    - { id: n2, agent: n2 }
    - { id: n3, agent: n3 }
    - { id: n4, agent: n4 }
    - { id: publish, agent: publish }
  edges:
    - { from: n1, to: n2 }
    - { from: n2, to: n3 }
    - { from: n3, to: n4 }
    - { from: n4, to: publish }
